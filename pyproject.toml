[project]
name = "whatsapp-sales-agent"
version = "0.1.0"
description = "Assistant commercial WhatsApp pour petits vendeurs en Côte d'Ivoire — projet LLM Zoomcamp"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "pgvector==0.3.4",
    "openai==1.51.0",
    "rank-bm25==0.2.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "tqdm==4.66.5",
    "python-dotenv==1.0.1",
    "streamlit==1.39.0",
    "requests==2.32.3",
    "tenacity==9.0.0",
    "scikit-learn==1.5.2",
    "matplotlib==3.9.2",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]
orchestration = ["prefect>=2.20"]

[tool.pytest.ini_options]
pythonpath = ["."]

# Ceci est une application (app/, scripts/), pas une librairie à publier :
# on dit à uv de ne pas essayer de la construire/installer comme package.
[tool.uv]
package = false
